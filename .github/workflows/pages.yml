# GitHub Pages bleibt auf „Deploy from a branch: main / (root)“.
# Dieser Workflow baut die Vite-App und committet die statischen Dateien
# in das Root, das Pages ausliefert. Die Quelle liegt unter site/.

name: Publish built site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-built-site
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Statische Dateien bauen
        run: npm run build

      - name: Build ins Repository-Root legen
        run: npm run pages:sync

      - name: Gebaute Seite committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Build entspricht dem Stand im Repository."
            exit 0
          fi
          git commit -m "Publish built site for GitHub Pages [skip ci]"
          git push origin HEAD:main
